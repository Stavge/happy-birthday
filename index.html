<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Marios</title>

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

    <!-- =====================================
         V3 — GIFT / PASSWORD SCREEN
    ====================================== -->

    <main id="password-screen" class="screen active">

        <div class="gift-scene">

            <!-- Hand-drawn heart -->
            <div class="heart-mark" aria-hidden="true">
                <svg viewBox="0 0 70 60">
                    <path d="M35 52
                             C28 44, 8 32, 10 17
                             C11 7, 23 5, 29 12
                             C33 16, 35 22, 35 22
                             C35 22, 38 15, 43 11
                             C51 5, 62 9, 61 20
                             C60 32, 46 43, 35 52"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.4"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </div>

            <p class="gift-label">
                A little something for you
            </p>


            <!-- =====================================
                 GIFT
            ====================================== -->

            <div id="gift" class="gift">

                <div class="gift-aura"></div>

                <!-- card that will rise from the box -->
                <div class="gift-card">

                    <div class="gift-card-inner">

                        <span class="card-small">
                            For you...
                        </span>

                        <span class="card-title">
                            Χρόνια Πολλά<br>
                            Μάριε!
                        </span>

                        <span class="card-line"></span>

                    </div>

                </div>


                <!-- box -->
                <div class="gift-box">

                    <div class="box-back"></div>

                    <div class="box-body">

                        <div class="body-highlight"></div>

                        <div class="vertical-ribbon"></div>

                    </div>


                    <!-- lid -->
                    <div class="gift-lid">

                        <div class="lid-top"></div>

                        <div class="lid-front"></div>

                        <div class="lid-ribbon"></div>

                    </div>


                    <!-- bow -->
                    <div class="gift-bow">

                        <div class="bow-loop bow-left"></div>

                        <div class="bow-loop bow-right"></div>

                        <div class="bow-knot"></div>

                        <div class="bow-tail tail-left"></div>

                        <div class="bow-tail tail-right"></div>

                    </div>

                </div>

            </div>


            <!-- =====================================
                 PASSWORD
            ====================================== -->

            <div id="password-area" class="password-area">

                <div class="password-pill">

                    <input
                        type="password"
                        id="password-input"
                        placeholder="••••••"
                        autocomplete="off"
                        aria-label="Password"
                    >

                    <span class="password-divider"></span>

                    <button
                        id="unlock-button"
                        aria-label="Άνοιγμα δώρου"
                    >
                        →
                    </button>

                </div>

                <p id="error-message"></p>

            </div>

        </div>

    </main>



    <!-- =====================================
         INTRO SCREEN
    ====================================== -->

    <main id="intro-screen" class="screen hidden">

        <div class="intro-container">

            <p class="small-label fade-element">
                For Marios
            </p>

            <h1 class="main-title fade-element">
                Χρόνια Πολλά<br>
                Μάριε!
            </h1>

            <div class="line"></div>

            <p class="intro-subtitle fade-element">
                Δεν είναι ακριβώς μια ευχή.
            </p>

            <button
                id="start-button"
                class="arrow-button"
                aria-label="Συνέχεια"
            >
                →
            </button>

        </div>

    </main>



    <!-- =====================================
         STORY SCREEN
    ====================================== -->

    <main id="story-screen" class="screen hidden">

        <div class="story-container">

            <div class="story-progress">
                <span id="progress-number">01</span>
            </div>

            <div id="story-text" class="story-text"></div>

            <div class="story-hint">

                <span class="desktop-hint">
                    ENTER · SPACE · CLICK
                </span>

                <span class="mobile-hint">
                    SWIPE
                </span>

            </div>

        </div>

    </main>



    <!-- =====================================
         FINAL SCREEN
    ====================================== -->

    <main id="final-screen" class="screen hidden">

        <div class="final-container">

            <div class="final-symbol">
                ♡
            </div>

            <h1>
                Χρόνια πολλά,<br>
                Μάριε.
            </h1>

            <p>
                Και ό,τι κι αν γίνει,
                θέλω να θυμάσαι κάτι.
            </p>

            <p class="final-emphasis">
                Έχεις έναν άνθρωπο που νοιάζεται
                πραγματικά για εσένα.
            </p>

            <div class="final-line"></div>

            <button
                id="replay-button"
                class="text-button"
            >
                ↻ Ξανά από την αρχή
            </button>

        </div>

    </main>


    <script src="script.js?v=3"></script>

</body>

</html>
