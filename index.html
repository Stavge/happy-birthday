<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Marios</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

    <!-- V3 GIFT / PASSWORD -->
    <main id="password-screen" class="screen active">
        <section class="gift-scene">

            <div class="heart-mark" aria-hidden="true">
                <svg viewBox="0 0 70 60">
                    <path d="M35 52
                             C28 44, 8 32, 10 17
                             C11 7, 23 5, 29 12
                             C33 16, 35 22, 35 22
                             C35 22, 38 15, 43 11
                             C51 5, 62 9, 61 20
                             C60 32, 46 43, 35 52"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.35"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </div>

            <p class="gift-label">A little something for you</p>

            <div id="gift-visual" class="gift-visual">
                <img
                    id="gift-cover"
                    class="gift-cover"
                    src="assets/gift/gift-cover.webp"
                    alt=""
                >

                <video
                    id="gift-video"
                    class="gift-video"
                    muted
                    playsinline
                    preload="auto"
                    aria-hidden="true"
                >
                    <source src="assets/gift/gift-opening.mp4" type="video/mp4">
                </video>

                <div class="visual-glow"></div>
            </div>

            <div id="password-area" class="password-area">
                <div id="password-pill" class="password-pill">
                    <input
                        id="password-input"
                        type="password"
                        placeholder="••••••"
                        autocomplete="off"
                        aria-label="Password"
                    >

                    <span class="password-divider"></span>

                    <button id="unlock-button" aria-label="Άνοιγμα">
                        →
                    </button>
                </div>

                <p id="error-message"></p>
            </div>

        </section>
    </main>


    <!-- CARD / INTRO -->
    <main id="intro-screen" class="screen paper-screen hidden">
        <div class="paper-grain"></div>

        <div class="intro-container">
            <p class="paper-small">For Marios</p>

            <h1 class="main-title">
                Χρόνια Πολλά<br>
                Μάριε!
            </h1>

            <div class="paper-line"></div>

            <p class="intro-subtitle">
                Δεν είναι ακριβώς μια ευχή.
            </p>

            <button
                id="start-button"
                class="paper-arrow"
                aria-label="Συνέχεια"
            >
                →
            </button>
        </div>
    </main>


    <!-- STORY -->
    <main id="story-screen" class="screen hidden">
        <div class="story-container">

            <div class="story-progress">
                <span id="progress-number">01</span>
            </div>

            <div id="story-text" class="story-text"></div>

            <div class="story-hint">
                <span class="desktop-hint">ENTER · SPACE · CLICK</span>
                <span class="mobile-hint">SWIPE</span>
            </div>

        </div>
    </main>


    <!-- FINAL -->
    <main id="final-screen" class="screen hidden">
        <div class="final-container">

            <div class="final-symbol">♡</div>

            <h1>
                Χρόνια πολλά,<br>
                Μάριε.
            </h1>

            <p>
                Και ό,τι κι αν γίνει,
                θέλω να θυμάσαι κάτι.
            </p>

            <p class="final-emphasis">
                Έχεις έναν άνθρωπο που νοιάζεται
                πραγματικά για εσένα.
            </p>

            <div class="final-line"></div>

            <button id="replay-button" class="text-button">
                ↻ Ξανά από την αρχή
            </button>

        </div>
    </main>

    <script src="script.js?v=4"></script>
</body>
</html>
