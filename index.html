<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Marios</title>
    <link rel="stylesheet" href="style.css?v=7">
</head>

<body>

    <!-- =====================================
         ENVELOPE / PASSWORD SCREEN
    ====================================== -->

    <main id="password-screen" class="screen active">

        <section class="envelope-scene">

            <div class="heart-mark" aria-hidden="true">
                <svg viewBox="0 0 70 60">
                    <path d="M35 52
                             C28 44, 8 32, 10 17
                             C11 7, 23 5, 29 12
                             C33 16, 35 22, 35 22
                             C35 22, 38 15, 43 11
                             C51 5, 62 9, 61 20
                             C60 32, 46 43, 35 52"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.35"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </div>

            <p class="scene-label">
                A little something for you
            </p>

            <div class="envelope-wrapper">

                <div class="envelope-glow"></div>

                <!-- LETTER -->
                <div id="letter-sheet" class="letter-sheet">
                    <div class="letter-inner">
                        <p class="letter-small">For you...</p>
                    </div>
                </div>

                <!-- ENVELOPE -->
                <div id="envelope" class="envelope">

                    <div class="envelope-back"></div>

                    <div id="envelope-flap" class="envelope-flap"></div>

                    <div class="envelope-front">
                        <div class="front-left"></div>
                        <div class="front-right"></div>
                        <div class="front-bottom"></div>
                    </div>

                    <div id="wax-seal" class="wax-seal">
                        <span class="seal-heart">♡</span>
                    </div>

                </div>

            </div>

            <div id="password-area" class="password-area">

                <div id="password-pill" class="password-pill">

                    <input
                        id="password-input"
                        type="password"
                        placeholder="••••••"
                        autocomplete="off"
                        aria-label="Password"
                    >

                    <span class="password-divider"></span>

                    <button id="unlock-button" aria-label="Άνοιγμα">
                        →
                    </button>

                </div>

                <p id="error-message"></p>

            </div>

        </section>

    </main>



    <!-- =====================================
         INTRO SCREEN
    ====================================== -->

    <main id="intro-screen" class="screen paper-screen hidden">

        <div class="paper-grain"></div>

        <div class="intro-container">

            <p class="paper-small">
                For Marios
            </p>

            <h1 class="main-title">
                Χρόνια Πολλά<br>
                Μάριε!
            </h1>

            <div class="paper-line"></div>

            <p class="intro-subtitle">
                Δεν είναι ακριβώς μια ευχή.
            </p>

            <button
                id="start-button"
                class="paper-arrow"
                aria-label="Συνέχεια"
            >
                →
            </button>

        </div>

    </main>



    <!-- =====================================
         STORY SCREEN
    ====================================== -->

    <main id="story-screen" class="screen hidden">

        <div class="story-container">

            <div class="story-progress">
                <span id="progress-number">01</span>
            </div>

            <div id="story-text" class="story-text"></div>

            <div class="story-hint">
                <span class="desktop-hint">ENTER · SPACE · CLICK</span>
                <span class="mobile-hint">SWIPE</span>
            </div>

        </div>

    </main>



    <!-- =====================================
         FINAL SCREEN
    ====================================== -->

    <main id="final-screen" class="screen hidden">

        <div class="final-container">

            <div class="final-symbol">♡</div>

            <h1>
                Χρόνια πολλά,<br>
                Μάριε.
            </h1>

            <p>
                Και ό,τι κι αν γίνει,
                θέλω να θυμάσαι κάτι.
            </p>

            <p class="final-emphasis">
                Έχεις έναν άνθρωπο που νοιάζεται
                πραγματικά για εσένα.
            </p>

            <div class="final-line"></div>

            <button id="replay-button" class="text-button">
                ↻ Ξανά από την αρχή
            </button>

        </div>

    </main>

    <script src="script.js?v=5"></script>
</body>

</html>
